name: Generate initial EF migration

# Run once from the Actions tab (workflow_dispatch). It generates the first EF Core migration
# and commits it, because production startup refuses to run without migrations.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef

      - name: Create migration
        env:
          NUSKHA_CONNECTION: Host=localhost;Database=nuskha;Username=nuskha;Password=unused
        run: |
          dotnet restore src/Nuskha.Infrastructure
          if ls src/Nuskha.Infrastructure/Data/Migrations/*.cs >/dev/null 2>&1; then
            echo "Migrations already exist; nothing to do."; exit 0
          fi
          dotnet ef migrations add InitialCreate -p src/Nuskha.Infrastructure -o Data/Migrations

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Nuskha.Infrastructure/Data/Migrations
          git diff --cached --quiet && { echo "No changes."; exit 0; }
          git commit -m "Add initial EF Core migration"
          git push
