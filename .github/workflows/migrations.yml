name: Generate EF migration

# Run from the Actions tab (workflow_dispatch) after changing the EF model. It generates a migration with the given
# name and commits it; production start-up applies pending migrations automatically.
on:
  workflow_dispatch:
    inputs:
      name:
        description: Migration name (letters and digits, e.g. AddBannersTagsReview)
        required: true
        default: Update

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef

      - name: Create migration
        env:
          NUSKHA_CONNECTION: Host=localhost;Database=nuskha;Username=nuskha;Password=unused
          MIGRATION_NAME: ${{ github.event.inputs.name }}
        run: |
          dotnet restore src/Nuskha.Infrastructure
          if ! [[ "$MIGRATION_NAME" =~ ^[A-Za-z][A-Za-z0-9]{0,60}$ ]]; then
            echo "Invalid migration name: letters and digits only."; exit 1
          fi
          dotnet ef migrations add "$MIGRATION_NAME" -p src/Nuskha.Infrastructure -o Data/Migrations

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Nuskha.Infrastructure/Data/Migrations
          git diff --cached --quiet && { echo "No changes."; exit 0; }
          git commit -m "Add initial EF Core migration"
          git push
